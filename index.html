<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENGR 4451 - Dinamik Kod Yoklama</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .card { background: white; border-radius: 20px; padding: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); margin-bottom: 20px; }
        h1 { color: #667eea; text-align: center; margin-bottom: 30px; font-size: 36px; }
        .input-field { width: 100%; padding: 15px; border: 2px solid #ddd; border-radius: 10px; font-size: 16px; margin-bottom: 20px; }
        .input-field:focus { outline: none; border-color: #667eea; }
        .btn { width: 100%; padding: 15px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; transition: all 0.3s; }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .hidden { display: none; }
        .qr-section { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 30px; }
        .qr-box { background: white; padding: 40px; border-radius: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .code-display { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 60px; border-radius: 20px; text-align: center; color: white; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .dynamic-code { font-size: 120px; font-weight: bold; letter-spacing: 20px; text-shadow: 0 5px 15px rgba(0,0,0,0.3); margin: 30px 0; }
        .progress-ring { width: 200px; height: 200px; margin: 0 auto 30px; }
        .progress-ring-circle { stroke: rgba(255,255,255,0.3); fill: none; stroke-width: 8; }
        .progress-ring-fill { stroke: white; fill: none; stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 0.5s; transform: rotate(-90deg); transform-origin: 50% 50%; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: #667eea; color: white; padding: 15px; text-align: left; }
        td { padding: 15px; border-bottom: 1px solid #ddd; }
        .badge-pass { background: #28a745; color: white; padding: 5px 15px; border-radius: 20px; display: inline-block; }
        .badge-fail { background: #dc3545; color: white; padding: 5px 15px; border-radius: 20px; display: inline-block; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin: 30px 0; }
        .stat-box { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; border-radius: 15px; text-align: center; }
        .stat-num { font-size: 48px; font-weight: bold; }
        .stat-label { font-size: 14px; opacity: 0.9; margin-top: 10px; }
        .week-badge { display: inline-block; padding: 5px 10px; margin: 3px; border-radius: 10px; font-size: 12px; font-weight: bold; }
        .week-present { background: #28a745; color: white; }
        .week-absent { background: #dc3545; color: white; }
        .alert { padding: 20px; border-radius: 10px; margin: 20px 0; text-align: center; font-weight: bold; }
        .alert-success { background: #d4edda; color: #155724; border: 2px solid #c3e6cb; }
        .alert-danger { background: #f8d7da; color: #721c24; border: 2px solid #f5c6cb; }
        .alert-warning { background: #fff3cd; color: #856404; border: 2px solid #ffeaa7; }
        .alert-info { background: #d1ecf1; color: #0c5460; border: 2px solid #bee5eb; }
        @media (max-width: 768px) {
            .qr-section { grid-template-columns: 1fr; }
            .dynamic-code { font-size: 80px; letter-spacing: 10px; }
            .card { padding: 20px; }
            body { padding: 10px; }
            h1 { font-size: 24px; }
            .input-field { font-size: 14px; padding: 12px; }
            #sCode { font-size: 24px !important; letter-spacing: 5px !important; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="teacherLogin" class="card">
            <h1>👨‍🏫 Öğretmen Girişi</h1>
            <input type="text" id="tUsername" class="input-field" placeholder="Kullanıcı Adı: Orkun Karabaşoğlu">
            <input type="password" id="tPassword" class="input-field" placeholder="Şifre: orkun.karabasoglu">
            <button class="btn" onclick="teacherLogin()">Giriş Yap</button>
        </div>

        <div id="teacherPanel" class="hidden">
            <div class="card">
                <h1>📊 Yoklama Paneli</h1>
                <select id="weekSelect" class="input-field">
                    <option value="">Hafta Seçin...</option>
                </select>
                <button class="btn" onclick="showQR()">QR Oluştur</button>
                <button class="btn" onclick="showReport()" style="margin-top: 10px; background: #28a745;">Rapor Görüntüle</button>
                
                <div id="qrArea" class="hidden">
                    <h2 style="text-align: center; color: #667eea; margin: 30px 0;">Hafta <span id="qrWeek"></span> - Akıllı Tahtada Gösterin</h2>
                    <div class="qr-section">
                        <div class="qr-box">
                            <h3 style="color: #667eea; margin-bottom: 20px;">📱 QR Kod</h3>
                            <div id="qrcode"></div>
                            <p style="margin-top: 20px; color: #666; font-size: 14px;">Öğrenciler bu kodu okutacak</p>
                        </div>
                        <div class="code-display">
                            <h3 style="margin-bottom: 10px; font-size: 24px;">🔐 Dinamik Doğrulama Kodu</h3>
                            <p style="font-size: 16px; opacity: 0.9; margin-bottom: 20px;">Öğrenciler bu kodu girecek</p>
                            <svg class="progress-ring">
                                <circle class="progress-ring-circle" cx="100" cy="100" r="90"/>
                                <circle id="progressCircle" class="progress-ring-fill" cx="100" cy="100" r="90" stroke-dasharray="565.48" stroke-dashoffset="0"/>
                            </svg>
                            <div class="dynamic-code" id="dynamicCode">----</div>
                            <p style="font-size: 18px; opacity: 0.9;">Kalan: <span id="countdown">30</span> saniye</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="reportScreen" class="hidden">
            <div class="card">
                <h1>📈 Devam Raporu</h1>
                <button class="btn" onclick="backToPanel()">← Geri</button>
                <div id="reportStats"></div>
                <div id="reportTable"></div>
                <button class="btn" onclick="exportCSV()" style="margin-top: 20px; background: #28a745;">CSV İndir</button>
            </div>
        </div>

        <div id="studentLogin" class="hidden">
            <div class="card">
                <h1>🎓 Hafta <span id="sWeek"></span> Yoklama</h1>
                <input type="text" id="sName" class="input-field" placeholder="Ad Soyad (BÜYÜK HARF)">
                <input type="password" id="sNumber" class="input-field" placeholder="Okul Numarası (Şifre)">
                <input type="text" id="sCode" class="input-field" placeholder="Ekrandaki 4 Haneli Kodu Girin" maxlength="4" style="text-align: center; font-size: 32px; letter-spacing: 10px; font-weight: bold;">
                <button id="submitBtn" class="btn" onclick="submitAttendance()">✅ Yoklama Al</button>
                <div id="result"></div>
                <div id="studentStats" class="hidden"></div>
            </div>
        </div>
    </div>

    <script>
        const TEACHER = {user: 'Orkun Karabaşoğlu', pass: 'orkun.karabasoglu'};
        const MAX_WEEKS = 14, PASS_PERCENT = 70;
        const CODE_INTERVAL = 30000; // 30 saniye
        const SECRET_KEY = 'ENGR4451_2024_YU'; // Kod üretimi için sabit anahtar
        
        const STUDENTS = {'İBRAHİM GÜLTEKİN':'18070003013','ELİF EMİNE GÜNAL':'19070001053','ERK YANKI URAL':'19070008012','ERCE ÖZKAN':'20070001057','İPEK ATİŞ':'20070002048','İDİL ECE CEVAHİR':'20070007004','SUDE ONFİDAN':'20070008016','ÖMER ARICA':'20070008017','SELİM MERT KIRCAALILI':'20070008019','BERİL DERAN GÜRBÜZ':'20070008029','ALİ HAKTAN SİĞİN':'21070001004','ARDA ALTUNHAN':'21070001051','EKREM TEMEL':'21070001070','NESRİN ŞENTÜRK':'21070002005','BATUHAN ŞİŞMAN':'21070002025','KIVANÇ EFE ERGÖNÜL':'21070005027','OĞUZ KOYUCAN':'21070005030','ZEYNEP ARSLANBUĞA':'21070005042','BESTE TEKİN':'21070007001','EKİN ALTUNKAYA':'21070007004','EMRE ERİŞİR':'21070008009','İSMAİL CANBERK DEMİRKAN':'21070008014','CAN GİRGİN':'21070008016','KEREM EROĞLU':'21070008017','ARMAĞAN SOYLU':'21070008027','ALP SERKAN MERKİT':'21070008033','ATAKAN DİNÇER':'21070008034','DEMET BÜYÜKTAŞ':'21070008206','GÜRKAN EROĞLU':'22070001041','EMRE EFE YÜKSEL':'22070001055','SÜLEYMAN BATU SARI':'22070002015','KADİR EMRE GÜNEŞ':'22070002047','TOPRAK TUNCER':'22070005040','EMRE CAN HEKİMOĞLU':'22070005053','ILGAR ŞENOL':'22070007014','EDA NUR ÇALIŞKAN':'22070008017','SAMİ BERK ŞAHİN':'22070008021','DENİZ ÜNVER':'22070008026','AYKAN KANLI':'22070008034','DENİZ KARATEPE':'22070008043','AYŞEGÜL KARINYARICI':'22070003022','AHMET ÖZGÜR KORKMAZ':'21070001046'};
        let data = JSON.parse(localStorage.getItem('attendance') || '{}');
        let codeInterval = null, countdownInterval = null;

        function hide(ids) { ids.forEach(id => document.getElementById(id).classList.add('hidden')); }
        function show(id) { hide(['teacherLogin','teacherPanel','reportScreen','studentLogin']); document.getElementById(id).classList.remove('hidden'); }

        // Basit hash fonksiyonu (Dinamik Kod Üretimi)
        function simpleHash(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                const char = str.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            return Math.abs(hash);
        }

        // Şu anki zaman dilimine göre kod üret
        function generateCode() {
            const now = Date.now();
            const timeSlot = Math.floor(now / CODE_INTERVAL); // 30 saniyelik dilimler
            const seed = `${SECRET_KEY}_${timeSlot}`;
            const hash = simpleHash(seed);
            return String(hash).slice(-4).padStart(4, '0');
        }

        // Kodun geçerli olup olmadığını kontrol et
        function validateCode(userCode) {
            const currentCode = generateCode();
            return userCode === currentCode;
        }

        function updateDynamicCode() {
            const code = generateCode();
            document.getElementById('dynamicCode').textContent = code;
            
            // Geri sayım
            const now = Date.now();
            const timeSlot = Math.floor(now / CODE_INTERVAL);
            const nextChange = (timeSlot + 1) * CODE_INTERVAL;
            const remaining = Math.ceil((nextChange - now) / 1000);
            
            document.getElementById('countdown').textContent = remaining;
            
            // İlerleme çubuğu
            const progress = (remaining / 30) * 565.48;
            document.getElementById('progressCircle').style.strokeDashoffset = 565.48 - progress;
        }

        function teacherLogin() {
            const u = document.getElementById('tUsername').value.trim();
            const p = document.getElementById('tPassword').value.trim();
            if (u === TEACHER.user && p === TEACHER.pass) {
                show('teacherPanel');
                const sel = document.getElementById('weekSelect');
                sel.innerHTML = '<option value="">Hafta Seçin...</option>';
                for (let i = 1; i <= MAX_WEEKS; i++) sel.innerHTML += `<option value="${i}">Hafta ${i}</option>`;
            } else alert('❌ Hatalı giriş!');
        }

        function showQR() {
            const w = document.getElementById('weekSelect').value;
            if (!w) return alert('Hafta seçin!');
            
            document.getElementById('qrWeek').textContent = w;
            document.getElementById('qrcode').innerHTML = '';
            new QRCode(document.getElementById('qrcode'), {
                text: `${location.href.split('?')[0]}?week=${w}`,
                width: 300, height: 300
            });
            
            document.getElementById('qrArea').classList.remove('hidden');
            
            // Dinamik kod sistemini başlat
            updateDynamicCode();
            if (codeInterval) clearInterval(codeInterval);
            if (countdownInterval) clearInterval(countdownInterval);
            
            codeInterval = setInterval(updateDynamicCode, 1000);
        }

        function showReport() {
            show('reportScreen');
            if (codeInterval) clearInterval(codeInterval);
            if (countdownInterval) clearInterval(countdownInterval);
            
            // Hafta tarihleri - Her Salı
            const weekDates = [
                '30.09.2025', '07.10.2025', '14.10.2025', '21.10.2025',
                '28.10.2025', '04.11.2025', '11.11.2025', '18.11.2025',
                '25.11.2025', '02.12.2025', '09.12.2025', '16.12.2025',
                '23.12.2025', '30.12.2025'
            ];
            
            const stats = {};
            Object.entries(STUDENTS).forEach(([n, num]) => stats[num] = {name: n, weeks: []});
            for (let i = 1; i <= MAX_WEEKS; i++) {
                (data[`week${i}`] || []).forEach(s => {
                    if (stats[s.number]) stats[s.number].weeks.push(i);
                });
            }
            let total = 0, pass = 0, fail = 0;
            Object.values(stats).forEach(s => {
                total += s.weeks.length;
                const absent = MAX_WEEKS - s.weeks.length;
                (absent <= 4) ? pass++ : fail++;
            });
            document.getElementById('reportStats').innerHTML = `
                <div class="stats">
                    <div class="stat-box"><div class="stat-num">${Object.keys(stats).length}</div><div class="stat-label">Toplam Öğrenci</div></div>
                    <div class="stat-box"><div class="stat-num">${pass}</div><div class="stat-label">Geçen</div></div>
                    <div class="stat-box"><div class="stat-num">${fail}</div><div class="stat-label">Kalan</div></div>
                    <div class="stat-box"><div class="stat-num">${(total / (Object.keys(stats).length * MAX_WEEKS) * 100).toFixed(1)}%</div><div class="stat-label">Ortalama Devam</div></div>
                </div>
                <div style="background: #f8f9fa; padding: 20px; border-radius: 10px; margin-bottom: 20px;">
                    <h3 style="color: #333; margin-bottom: 15px;">📅 Ders Tarihleri (Salı Günleri)</h3>
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px;">
                        ${weekDates.map((date, i) => `<div style="background: white; padding: 10px; border-radius: 8px; text-align: center;">
                            <strong>Hafta ${i + 1}</strong><br>${date}
                        </div>`).join('')}
                    </div>
                </div>`;
            let html = '<table><thead><tr><th>No</th><th>Ad Soyad</th><th>Katılım</th><th>Devamsızlık</th><th>Oran</th><th>Haftalar</th><th>Durum</th></tr></thead><tbody>';
            Object.entries(stats).sort((a,b) => a[0].localeCompare(b[0])).forEach(([num, s]) => {
                const att = s.weeks.length;
                const abs = MAX_WEEKS - att;
                const per = (att / MAX_WEEKS * 100).toFixed(1);
                const passed = abs <= 4;
                const weeks = Array.from({length: MAX_WEEKS}, (_, i) => i + 1).map(i => 
                    `<span class="week-badge week-${s.weeks.includes(i) ? 'present' : 'absent'}">${i}</span>`
                ).join('');
                html += `<tr><td>${num}</td><td>${s.name}</td><td>${att}/${MAX_WEEKS}</td><td><strong>${abs}</strong></td><td>${per}%</td><td>${weeks}</td><td>${passed ? '<span class="badge-pass">✓ Geçti</span>' : '<span class="badge-fail">✗ Kaldı</span>'}</td></tr>`;
            });
            document.getElementById('reportTable').innerHTML = html + '</tbody></table>';
        }

        function backToPanel() { show('teacherPanel'); }

        async function submitAttendance() {
            const name = document.getElementById('sName').value.trim().toUpperCase();
            const num = document.getElementById('sNumber').value.trim();
            const code = document.getElementById('sCode').value.trim();
            const week = new URLSearchParams(location.search).get('week');
            const btn = document.getElementById('submitBtn');
            
            btn.disabled = true; btn.textContent = '⏳ Kontrol ediliyor...';
            
            if (!name || !num || !code) {
                showResult('⚠️ Tüm alanları doldurun!', 'warning');
                btn.disabled = false; btn.textContent = '✅ Yoklama Al';
                return;
            }
            
            if (code.length !== 4 || !/^\d{4}$/.test(code)) {
                showResult('⚠️ Kod 4 haneli rakam olmalıdır!', 'warning');
                btn.disabled = false; btn.textContent = '✅ Yoklama Al';
                return;
            }
            
            try {
                await new Promise(r => setTimeout(r, 500));
                
                // Öğrenci bilgisi kontrolü
                if (STUDENTS[name] !== num) {
                    throw new Error('Hatalı bilgi! Ad BÜYÜK HARF olmalı, şifre okul numaranızdır.');
                }
                
                // Dinamik kod kontrolü
                if (!validateCode(code)) {
                    throw new Error('Hatalı veya süresi dolmuş kod!\n\nEkrandaki güncel kodu girdiğinizden emin olun.\nKod her 30 saniyede bir değişir.');
                }
                
                // Kayıt kontrolü
                const key = `week${week}`;
                if (!data[key]) data[key] = [];
                if (data[key].some(s => s.number === num)) {
                    throw new Error('Bu hafta için zaten yoklama kaydınız var!');
                }
                
                // Kaydet
                data[key].push({
                    name, 
                    number: num, 
                    timestamp: Date.now(),
                    code: code
                });
                localStorage.setItem('attendance', JSON.stringify(data));
                
                showResult(`✅ BAŞARILI!\n\n${name}\nHafta ${week} yoklamanız kaydedildi!\n\n🔐 Kod Doğrulandı: ${code}`, 'success');
                btn.textContent = '✓ KAYIT ALINDI';
                showStats(num);
            } catch (e) {
                showResult(`❌ HATA:\n\n${e.message || e}`, 'danger');
                btn.disabled = false; btn.textContent = '✅ Yoklama Al';
            }
        }

        function showStats(num) {
            let weeks = [];
            for (let i = 1; i <= MAX_WEEKS; i++) {
                if (data[`week${i}`]?.some(s => s.number === num)) weeks.push(i);
            }
            const att = weeks.length;
            const abs = MAX_WEEKS - att;
            const maxAbsent = 4; // Maksimum devamsızlık hakkı
            const remaining = maxAbsent - abs;
            
            let status = '';
            if (remaining >= 0) {
                status = `<div class="alert alert-${remaining > 1 ? 'success' : 'warning'}" style="font-size: 24px; padding: 30px;">
                    🎯 Kalan Devamsızlık Hakkınız: <strong>${remaining}</strong> hafta
                </div>`;
            } else {
                status = '<div class="alert alert-danger" style="font-size: 24px; padding: 30px;">❌ Devamsızlık hakkınız kalmadı!</div>';
            }
            
            document.getElementById('studentStats').innerHTML = status;
            document.getElementById('studentStats').classList.remove('hidden');
        }

        function showResult(msg, type) {
            document.getElementById('result').innerHTML = `<div class="alert alert-${type}">${msg.replace(/\n/g, '<br>')}</div>`;
        }

        function exportCSV() {
            let csv = 'No,Ad Soyad,Katılım,Devamsızlık,Oran,Durum,Haftalar\n';
            const stats = {};
            Object.entries(STUDENTS).forEach(([n, num]) => stats[num] = {name: n, weeks: []});
            for (let i = 1; i <= MAX_WEEKS; i++) {
                (data[`week${i}`] || []).forEach(s => {
                    if (stats[s.number]) stats[s.number].weeks.push(i);
                });
            }
            Object.entries(stats).forEach(([num, s]) => {
                const att = s.weeks.length;
                const abs = MAX_WEEKS - att;
                const per = (att / MAX_WEEKS * 100).toFixed(1);
                const passed = abs <= 4 ? 'Geçti' : 'Kaldı';
                csv += `"${num}","${s.name}","${att}/${MAX_WEEKS}","${abs}","${per}%","${passed}","${s.weeks.join('-')}"\n`;
            });
            const blob = new Blob(['\ufeff' + csv], {type: 'text/csv;charset=utf-8;'});
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `rapor_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
        }

        window.onload = () => {
            const params = new URLSearchParams(location.search);
            if (params.has('week')) {
                show('studentLogin');
                document.getElementById('sWeek').textContent = params.get('week');
            } else {
                show('teacherLogin');
            }
        };
    </script>
</body>
</html>
